services:
  - type: web
    name: inkab-layout-configurator
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Valfri. Utan nyckel faller assistenten tillbaka på regelmotorns egna
      # åtgärdsförslag — verktyget fungerar fullt ut ändå.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Adresser som blir admin automatiskt vid registrering.
      - key: ADMIN_EMAILS
        value: robin@inkab.nu,daniel@inkab.nu,lars@inkab.nu
      # Signeringsnyckel för sessionscookien. Utan den loggas alla ut vid omstart.
      - key: AUTH_SECRET
        generateValue: true
      # Valfri. Utan den lever admins ändringar bara så länge servern gör det;
      # admin-vyn säger det rakt ut och erbjuder export till JSON.
      # Klistra in en Postgres-URL från Render, Neon eller Supabase.
      - key: DATABASE_URL
        sync: false
